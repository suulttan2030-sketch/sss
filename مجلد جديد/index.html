/* ================= مولّد xlsx خالص (بدون مكتبات) ================= */
function crc32(buf){
  if(!crc32.t){const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}crc32.t=t;}
  const t=crc32.t;let crc=0^(-1);
  for(let i=0;i<buf.length;i++)crc=(crc>>>8)^t[(crc^buf[i])&0xFF];
  return (crc^(-1))>>>0;
}
function strBytes(s){return new TextEncoder().encode(s);}
const u16=n=>[n&0xff,(n>>>8)&0xff];
const u32=n=>[n&0xff,(n>>>8)&0xff,(n>>>16)&0xff,(n>>>24)&0xff];
function buildZip(files){
  const enc=files.map(f=>({name:strBytes(f.name),data:f.data,crc:crc32(f.data)}));
  let local=[],central=[],offset=0;
  enc.forEach(f=>{
    const lh=[].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(f.crc),u32(f.data.length),u32(f.data.length),u16(f.name.length),u16(0));
    local.push(Uint8Array.from(lh),f.name,f.data);
    const ch=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(f.crc),u32(f.data.length),u32(f.data.length),u16(f.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    central.push(Uint8Array.from(ch),f.name);
    offset+=lh.length+f.name.length+f.data.length;
  });
  const cdSize=central.reduce((s,a)=>s+a.length,0);
  const eocd=Uint8Array.from([].concat(u32(0x06054b50),u16(0),u16(0),u16(enc.length),u16(enc.length),u32(cdSize),u32(offset),u16(0)));
  const parts=[...local,...central,eocd];
  const total=parts.reduce((s,a)=>s+a.length,0);
  const out=new Uint8Array(total);let p=0;parts.forEach(a=>{out.set(a,p);p+=a.length;});
  return out;
}
const xmlEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colName(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
function makeXlsx(sheetName, rows, colWidths){
  let sd='';
  rows.forEach((row,ri)=>{
    let cells='';
    row.forEach((cell,ci)=>{
      const ref=colName(ci)+(ri+1);
      if(cell==null||cell.v===''||cell.v==null)return;
      const sAttr=cell.s?(' s="'+cell.s+'"'):'';
      if(cell.t==='n'&&cell.v!==''&&isFinite(cell.v))cells+='<c r="'+ref+'"'+sAttr+'><v>'+cell.v+'</v></c>';
      else cells+='<c r="'+ref+'"'+sAttr+' t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(cell.v)+'</t></is></c>';
    });
    sd+='<row r="'+(ri+1)+'">'+cells+'</row>';
  });
  let colsXml='';
  if(colWidths&&colWidths.length){colsXml='<cols>';colWidths.forEach(function(w,i){if(w)colsXml+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';});colsXml+='</cols>';}
  const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews>'+colsXml+'<sheetData>'+sd+'</sheetData></worksheet>';
  const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FF1D5FD1"/><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2A2D38"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xmlEsc(sheetName).slice(0,31)+'" sheetId="1" r:id="rId1"/></sheets></workbook>';
  const wbr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  return buildZip([
    {name:'[Content_Types].xml',data:strBytes(ct)},
    {name:'_rels/.rels',data:strBytes(rels)},
    {name:'xl/workbook.xml',data:strBytes(wb)},
    {name:'xl/_rels/workbook.xml.rels',data:strBytes(wbr)},
    {name:'xl/styles.xml',data:strBytes(styles)},
    {name:'xl/worksheets/sheet1.xml',data:strBytes(sheet)},
  ]);
}
function download(name, blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function downloadXlsx(name,rows,sheet,colWidths){download(name,new Blob([makeXlsx(sheet,rows,colWidths)],{type:'application/octet-stream'}));}
function _sheetXml(rows,widths){
  let sd='';
  rows.forEach((row,ri)=>{let cells='';row.forEach((cell,ci)=>{const ref=colName(ci)+(ri+1);if(cell==null||cell.v===''||cell.v==null)return;const sAttr=cell.s?(' s="'+cell.s+'"'):'';if(cell.t==='n'&&cell.v!==''&&isFinite(cell.v))cells+='<c r="'+ref+'"'+sAttr+'><v>'+cell.v+'</v></c>';else cells+='<c r="'+ref+'"'+sAttr+' t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(cell.v)+'</t></is></c>';});sd+='<row r="'+(ri+1)+'">'+cells+'</row>';});
  let colsXml='';if(widths&&widths.length){colsXml='<cols>';widths.forEach(function(w,i){if(w)colsXml+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';});colsXml+='</cols>';}
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews>'+colsXml+'<sheetData>'+sd+'</sheetData></worksheet>';
}
function makeWorkbook(sheets){
  const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FF1D5FD1"/><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2A2D38"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const used={};const safe=(nm,i)=>{let n=(nm||('ورقة'+(i+1))).replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31)||('ورقة'+(i+1));let b=n,k=1;while(used[n]){n=(b.slice(0,28)+'_'+(++k));}used[n]=1;return n;};
  const names=sheets.map((sh,i)=>safe(sh.name,i));
  let ctO='',wbS='',wbR='',files=[];
  sheets.forEach((sh,i)=>{const idx=i+1;files.push({name:'xl/worksheets/sheet'+idx+'.xml',data:strBytes(_sheetXml(sh.rows||[],sh.widths))});ctO+='<Override PartName="/xl/worksheets/sheet'+idx+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';wbS+='<sheet name="'+xmlEsc(names[i])+'" sheetId="'+idx+'" r:id="rId'+idx+'"/>';wbR+='<Relationship Id="rId'+idx+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+idx+'.xml"/>';});
  const styleRid='rId'+(sheets.length+1);
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+ctO+'</Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+wbS+'</sheets></workbook>';
  const wbr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+wbR+'<Relationship Id="'+styleRid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  return buildZip([{name:'[Content_Types].xml',data:strBytes(ct)},{name:'_rels/.rels',data:strBytes(rels)},{name:'xl/workbook.xml',data:strBytes(wb)},{name:'xl/_rels/workbook.xml.rels',data:strBytes(wbr)},{name:'xl/styles.xml',data:strBytes(styles)}].concat(files));
}
function downloadWorkbook(name,sheets){download(name,new Blob([makeWorkbook(sheets)],{type:'application/octet-stream'}));}

/* ================= مساعدات التقارير (نوع القيد + النطاق) ================= */
function inRange(d){return (!ui.from||d>=ui.from)&&(!ui.to||d<=ui.to);}
function rangeText(){return (ui.from||ui.to)?('الفترة: '+(ui.from||'البداية')+' — '+(ui.to||'النهاية')):'كل الفترات';}
// تجميع الحركات: الافتتاحي = القيود الافتتاحية + العادية السابقة لتاريخ البداية؛ الحركة = العادية ضمن النطاق
function aggMaps(){
  const from=ui.from,to=ui.to,open={},move={};
  const add=(m,id,it)=>{const x=m[id]=m[id]||{d:0,c:0};x.d+=+it.debit||0;x.c+=+it.credit||0;};
  E.forEach(e=>{
    const before=from&&e.date<from, inR=(!from||e.date>=from)&&(!to||e.date<=to), afterTo=to&&e.date>to;
    const opening=e.kind==='opening';
    e.items.forEach(it=>{
      if(opening){ if(!afterTo) add(open,it.accountId,it); }
      else { if(before) add(open,it.accountId,it); else if(inR) add(move,it.accountId,it); }
    });
  });
  return {open,move};
}
function natFromMap(m,id){const a=byId[id];const x=m[id]||{d:0,c:0};return TYPES[a.type].normal==='debit'?x.d-x.c:x.c-x.d;}
function rolledMap(m,id){return natFromMap(m,id)+(childrenMap[id]||[]).reduce((s,k)=>s+rolledMap(m,k.id),0);}
function rolledDC(m,id){let d=(m[id]&&m[id].d)||0,c=(m[id]&&m[id].c)||0;(childrenMap[id]||[]).forEach(k=>{const r=rolledDC(m,k.id);d+=r.d;c+=r.c;});return{d,c};}

// بناء نافذة طباعة بنفس تنسيق التقرير (RTL، ألوان مطبوعة)
function buildReportHTML(title, sub, cols, rows, foot){
  const th='<tr>'+cols.map(c=>'<th style="text-align:'+(c.align||'right')+'">'+(c.html!=null?c.html:xmlEsc(c.t))+'</th>').join('')+'</tr>';
  const cell=c=>'<td style="text-align:'+(c.align||'right')+';'+(c.color?'color:'+c.color+';':'')+(c.bold?'font-weight:700;':'')+(c.pad?'padding-inline-start:'+c.pad+'px;':'')+'">'+(c.html!=null?c.html:xmlEsc(c.t==null?'':c.t))+'</td>';
  const tb=rows.map(r=>'<tr style="'+(r.bg?'background:'+r.bg+';':'')+'">'+r.cells.map(cell).join('')+'</tr>').join('');
  const ft=foot?'<tfoot><tr>'+foot.map(c=>'<td style="text-align:'+(c.align||'right')+';'+(c.color?'color:'+c.color+';':'')+'">'+(c.html!=null?c.html:xmlEsc(c.t==null?'':c.t))+'</td>').join('')+'</tr></tfoot>':'';
  return '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>'+xmlEsc(title)+'</title><style>'
    +'@page{size:A4 landscape;margin:12mm;}'
    +'*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}'
    +'body{font-family:Tahoma,\'Segoe UI\',sans-serif;color:#15171e;margin:0;padding:16px;}'
    +'.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #15171e;padding-bottom:8px;margin-bottom:12px;}'
    +'h1{font-size:19px;margin:0;} .sub{color:#7c715a;font-size:12px;}'
    +'table{width:100%;border-collapse:collapse;font-size:12px;}'
    +'th{background:#2a2d38;color:#faf6ec;padding:7px 9px;border:1px solid #cdbf9d;}'
    +'td{padding:5px 9px;border:1px solid #e6dcc4;}'
    +'tfoot td{background:#efe7d4;font-weight:800;}'
    +'</style></head><body><div class="head"><h1>'+xmlEsc(title)+'</h1><div class="sub">'+xmlEsc(sub)+'<br>طُبع في '+new Date().toLocaleString('en-GB')+'</div></div>'
    +'<table><thead>'+th+'</thead><tbody>'+tb+'</tbody>'+ft+'</table></body></html>';
}
function openPrint(title, sub, cols, rows, foot, pdf){
  const w=window.open('','_blank');
  if(!w){alert('فضلاً اسمح بالنوافذ المنبثقة لإتمام الطباعة/التصدير.');return;}
  if(pdf)alert('في نافذة الطباعة اختر الوجهة «حفظ كـ PDF» ثم احفظ.');
  w.document.open();w.document.write(buildReportHTML(title,sub,cols,rows,foot));w.document.close();
  w.focus();setTimeout(()=>{try{w.print();}catch(e){}},350);
}

function accountCombo(l,postable,onPick){
  const wrap=el('div',{style:{position:'relative',flex:1}});
  const cur=byId[l.accountId];
  const input=el('input',{style:merge(S.input,{width:'100%'}),placeholder:'ابحث بالاسم أو الرقم…',value:cur?(cur.code+' — '+cur.name):''});

  function show(q){

  input.addEventListener('focus',()=>{input.select();show('');});
  input.addEventListener('input',()=>show(input.value));

/* إبراز نص البحث */
function hl(text){
  text=String(text==null?'':text);
  const q=(ui.jq||'').trim();
  if(!q||text.indexOf(q)<0)return document.createTextNode(text);
  const span=el('span',{});let i=0,pos;
  while((pos=text.indexOf(q,i))>=0){
    if(pos>i)span.appendChild(document.createTextNode(text.slice(i,pos)));
    span.appendChild(el('mark',{style:{background:'#fff1a8',color:'inherit',padding:'0 1px',borderRadius:2}},text.slice(pos,pos+q.length)));
    i=pos+q.length;
  }
  if(i<text.length)span.appendChild(document.createTextNode(text.slice(i)));
  return span;
}

  const pool=A.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code),'en',{numeric:true}));
  function match(q){q=(q||'').trim();if(!q)return pool.slice(0,60);return pool.filter(a=>a.name.includes(q)||String(a.code).includes(q)).slice(0,60);}
  function show(q){
    list.innerHTML='';
    const res=match(q);
    if(!res.length)list.appendChild(el('div',{style:{padding:'9px 11px',color:C.muted}},'لا توجد نتائج'));
    res.forEach(a=>{
      const it=el('div',{style:{padding:'8px 11px',cursor:'pointer',borderBottom:'1px solid '+C.paperEdge,fontSize:14,display:'flex',justifyContent:'space-between',gap:10},
        onmousedown:ev=>{ev.preventDefault();ui.jacct=a.id;renderMain();}});
      it.appendChild(el('span',{style:{fontWeight:600,color:a.postable?C.blue:C.ink}},a.name+(a.postable?'':' (مجمّع)')));
      it.appendChild(el('span',{style:{color:C.muted,fontVariantNumeric:'tabular-nums'}},a.code));
      it.addEventListener('mouseenter',()=>it.style.background=C.blueBg);
      it.addEventListener('mouseleave',()=>it.style.background='#fff');
      list.appendChild(it);
    });
    list.style.display='block';
  }
  input.addEventListener('focus',()=>{input.select();show('');});
  input.addEventListener('input',()=>show(input.value));
  input.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){const r=match(input.value);if(r[0]){ui.jacct=r[0].id;renderMain();ev.preventDefault();}}
    else if(ev.key==='Escape')list.style.display='none';
  });
  input.addEventListener('blur',()=>setTimeout(()=>{list.style.display='none';const c=ui.jacct?byId[ui.jacct]:null;input.value=c?label(c):'';},150));
  wrap.appendChild(input);wrap.appendChild(list);
  if(cur)wrap.appendChild(el('button',{title:'إلغاء التصفية',style:{position:'absolute',insetInlineEnd:6,top:'50%',transform:'translateY(-50%)',border:'none',background:'transparent',color:C.muted,fontSize:18,lineHeight:1,cursor:'pointer'},onclick:()=>{ui.jacct='';renderMain();}},'×'));
  return wrap;
}

/* ================= القيود ================= */
function renderJournal(){
  const postable=A.filter(a=>a.postable).sort((a,b)=>String(a.code).localeCompare(String(b.code),'en',{numeric:true}));
  if(!postable.length){mainEl.appendChild(el('div',{style:S.empty,text:'لا توجد حسابات فرعية قابلة للترحيل.'}));return;}
  if(!J.lines.length)J.lines=[newLine(postable),newLine(postable)];

  const panel=el('div',{style:S.panel});
  const sealBox=el('div',{});
  panel.appendChild(el('div',{style:S.headRow},[
    el('h2',{style:S.panelTitle,text:J.editingId?'تعديل قيد':'قيد يومية جديد'}),
    sealBox,
  ]));
  const dateI=el('input',{type:'date',style:S.input,value:J.date,oninput:e=>J.date=e.target.value});
  const kindSel=el('select',{style:S.input,onchange:e=>J.kind=e.target.value});
  [['normal','قيد عادي'],['opening','قيد افتتاحي']].forEach(([v,l])=>kindSel.appendChild(el('option',{value:v},l)));
  kindSel.value=J.kind||'normal';
  const descI=el('input',{style:S.input,placeholder:'وصف العملية',value:J.desc,oninput:e=>J.desc=e.target.value});
  const linkedInLines=Array.from(new Set(J.lines.map(l=>l.accountId).filter(id=>id&&settleAcctLinked(id))));
  const supOpts=linkedInLines.length?settleSuppliersForAccts(linkedInLines):settleAllSuppliers();
  const supWrap=el('div',{style:{flex:1}});
  const supSel=el('select',{style:merge(S.input,{width:'100%'},linkedInLines.length?{borderColor:'#c99a2e',background:'#fffdf5'}:{}),onchange:e=>J.supplier=e.target.value});
  supSel.appendChild(el('option',{value:''},linkedInLines.length?'— اختر المورد (اختياري) —':'— بدون مورد —'));
  const _seen={};let _rows=[];
  supOpts.forEach(o=>{const _k=o.name+'|'+o.accId;if(_seen[_k])return;_seen[_k]=1;const _an=SETTLE.find(s=>s.accountId===o.accId);const _v=_an?_an.suppliers.find(x=>x.name===o.name):null;const _bal=(_v?_v.amount:0)-settleReduction(o.accId,o.name);_rows.push({name:o.name,bal:_bal});});
  let _show=_rows.filter(r=>r.bal>0.005);
  if(!_show.length)_show=_rows;
  _show.forEach(r=>supSel.appendChild(el('option',{value:r.name},r.name+' — '+fmt(r.bal)+' ريال')));
  supSel.value=(J.supplier||'');
  supWrap.appendChild(supSel);
  if(linkedInLines.length)supWrap.appendChild(el('div',{style:{fontSize:11.5,color:'#8a6d1a',marginTop:3}},'ℹ القيد يمسّ حساباً مرتبطاً بجدول تحليل — اختيار المورد اختياري لتحديث رصيده.'));
  else if(!supOpts.length)supWrap.appendChild(el('div',{style:{fontSize:11,color:C.muted,marginTop:3}},'لا يوجد موردون معرّفون (أنشئهم في «التسويات الجردية»).'));
  panel.appendChild(el('div',{style:S.formRow},[
    el('label',{style:S.field},['التاريخ',dateI]),
    el('label',{style:S.field},['نوع القيد',kindSel]),
    el('label',{style:merge(S.field,{flex:1})},['البيان',descI]),
    el('label',{style:merge(S.field,{flex:1})},['المورد',supWrap]),
  ]));
  panel.appendChild(el('div',{style:S.linesHead},[
    el('span',{style:{flex:1}},'الحساب الفرعي'),
    el('span',{style:{width:130,textAlign:'center',color:C.debit}},'مدين'),
    el('span',{style:{width:130,textAlign:'center',color:C.credit}},'دائن'),
    el('span',{style:{width:34}}),
  ]));
  const linesBox=el('div',{});
  panel.appendChild(linesBox);
  const sumD=el('div',{style:{width:130,textAlign:'center',fontWeight:700,color:C.debit}},'0.00');
  const sumC=el('div',{style:{width:130,textAlign:'center',fontWeight:700,color:C.credit}},'0.00');
  const addBtn=el('button',{style:S.ghost,onclick:()=>{J.lines.push(newLine(postable));drawLines();update();}},'+ سطر');
  panel.appendChild(el('div',{style:S.line},[addBtn,el('div',{style:{flex:1}}),sumD,sumC,el('div',{style:{width:34}})]));
  const errBox=el('div',{style:S.error});
  const saveBtn=el('button',{style:S.primary,onclick:doSave},J.editingId?'حفظ التعديل':'ترحيل القيد');
  const btns=el('div',{style:{display:'flex',gap:10,marginTop:14}},[saveBtn]);
  if(J.editingId)btns.appendChild(el('button',{style:S.ghost,onclick:()=>{resetJ(postable);renderJournal();}},'إلغاء'));
  panel.appendChild(errBox);panel.appendChild(btns);
  mainEl.appendChild(panel);

  function drawLines(){
    linesBox.innerHTML='';
    J.lines.forEach(l=>{
      const combo=accountCombo(l,postable,id=>{if(settleAcctLinked(id)||settleAllSuppliers().length){renderMain();}else{drawLines();}});
      const di=el('input',{style:merge(S.input,{width:130,textAlign:'center'}),type:'number',placeholder:'0.00',value:l.debit,oninput:e=>{l.debit=e.target.value;update();}});
      const ci=el('input',{style:merge(S.input,{width:130,textAlign:'center'}),type:'number',placeholder:'0.00',value:l.credit,oninput:e=>{l.credit=e.target.value;update();}});
      const rm=el('button',{style:S.ghost,onclick:()=>{if(J.lines.length>2){J.lines=J.lines.filter(x=>x.id!==l.id);drawLines();update();}}},'×');
      linesBox.appendChild(el('div',{style:S.line},[combo,di,ci,rm]));
      const acc=byId[l.accountId];
      if(acc&&acc.type==='asset'&&String(acc.code).slice(0,2)==='32'){
        const qi=el('input',{style:merge(S.input,{width:90,textAlign:'center'}),type:'number',placeholder:'الكمية',value:l.qty||'',oninput:e=>l.qty=e.target.value});
        const aci=el('input',{style:merge(S.input,{width:150}),placeholder:'رمز الأصل',value:l.assetCode||'',oninput:e=>l.assetCode=e.target.value,onchange:e=>{l.assetCode=e.target.value;const m=invByCode(l.assetCode);if(m){l.assetDesc=m.name;drawLines();}}});
        const adi=el('input',{style:merge(S.input,{width:200}),placeholder:'وصف الأصل',value:l.assetDesc||'',oninput:e=>l.assetDesc=e.target.value});
        linesBox.appendChild(el('div',{style:{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',margin:'-2px 0 8px',padding:'6px 10px',background:'#eef3fb',borderRadius:8,fontSize:12.5}},[
          el('span',{style:{color:C.blue,fontWeight:700}},'أصل غير متداول ('+acc.code+'):'),
          el('label',{style:{display:'flex',gap:5,alignItems:'center'}},['الكمية',qi]),
          el('label',{style:{display:'flex',gap:5,alignItems:'center'}},['رمز الأصل',aci]),
          el('label',{style:{display:'flex',gap:5,alignItems:'center'}},['وصف الأصل',adi]),
          el('span',{style:{color:C.muted}},'(مدين=إضافة · دائن=استبعاد — يُربط بسجل الأصول)'),
        ]));
      }
    });
  }
  function update(){
    let d=0,c=0;J.lines.forEach(l=>{d+=+l.debit||0;c+=+l.credit||0;});
    sumD.textContent=fmt(d);sumC.textContent=fmt(c);
    const diff=d-c,balanced=d>0&&Math.abs(diff)<0.005;
    sealBox.innerHTML='';
    sealBox.appendChild(el('div',{style:merge(S.sealBox,balanced?{borderColor:C.gold,background:'#fbf4dd',color:C.gold}:{borderColor:C.line,background:C.paper,color:C.muted})},[
      el('div',{style:{fontSize:16}},'⚖'),
      el('span',{},balanced?'متوازن':'فرق '+fmt(Math.abs(diff))),
    ]));
    Object.assign(saveBtn.style,merge(S.primary,balanced?{}:S.disabled));saveBtn.disabled=!balanced;
  }
  function doSave(){
    let d=0,c=0;J.lines.forEach(l=>{d+=+l.debit||0;c+=+l.credit||0;});
    if(!(d>0&&Math.abs(d-c)<0.005)){errBox.textContent='قاعدة التوازن: مجموع المدين يجب أن يساوي مجموع الدائن.';return;}
    const items=J.lines.filter(l=>l.accountId&&((+l.debit||0)>0||(+l.credit||0)>0)).map(function(l){const it={accountId:l.accountId,debit:+l.debit||0,credit:+l.credit||0};const a=byId[l.accountId];if(a&&a.type==='asset'&&String(a.code).slice(0,2)==='32'){if(l.qty!==''&&l.qty!=null)it.qty=+l.qty||0;if(l.assetCode&&String(l.assetCode).trim())it.assetCode=String(l.assetCode).trim();if(l.assetDesc&&String(l.assetDesc).trim())it.assetDesc=String(l.assetDesc).trim();}return it;});
    if(items.length<2){errBox.textContent='القيد يحتاج طرفين على الأقل.';return;}
    // (التسويات الجردية) تذكير اختياري — يظهر مرة ولا يمنع الحفظ
    const linkedAccts=Array.from(new Set(items.map(it=>it.accountId))).filter(id=>settleAcctLinked(id));
    if(linkedAccts.length){
      const accNames=linkedAccts.map(id=>byId[id]?byId[id].name:id).join('، ');
      const sup=(J.supplier||'').trim();
      if(!sup){alert('تنبيه (اختياري): هذا القيد يمسّ حساباً مرتبطاً بجدول التسويات الجردية ('+accNames+'). يمكنك اختيار اسم المورد المعني ليُحدَّث رصيده — أو اضغط «حسناً» للمتابعة بدون مورد.');}
      else{const okAcct=linkedAccts.some(id=>{const an=SETTLE.find(s=>s.accountId===id);return an&&an.suppliers.some(v=>v.name===sup);});if(!okAcct)alert('تنبيه (اختياري): المورد «'+sup+'» غير مرتبط بالحساب المستخدم في القيد ('+accNames+'). سيُحفظ القيد كما هو.');}
    }
    // (استبعاد) رمز الأصل إلزامي في الجانب الدائن لأي أصل غير متداول
    const _missCode=items.some(function(it){const a=byId[it.accountId];return a&&a.type==='asset'&&String(a.code).slice(0,2)==='32'&&(it.credit||0)>0&&!it.assetCode;});
    if(_missCode){errBox.textContent='عند استبعاد أصل غير متداول (الجانب الدائن) يجب إدخال «رمز الأصل» — لن يُقبل القيد بدونه.';return;}
    let no;
    if(J.editingId){const ex=E.find(e=>e.id===J.editingId);no=ex&&ex.no?ex.no:nextNo();}
    else no=nextNo();
    const entry={id:J.editingId||rid(),no:no,date:J.date,kind:J.kind||'normal',description:J.desc.trim(),supplier:(J.supplier||'').trim()||null,items};
    if(J.editingId)E=E.map(e=>e.id===J.editingId?entry:e);else E.push(entry);
    // ربط الأصول غير المتداولة بسجل الأصول — يُطبَّق فقط عند إنشاء قيد جديد (لا عند تعديل قيد سابق)
    const _dupMsgs=[];const _addedCodes={};
    if(!J.editingId){
      items.forEach(function(it){const a=byId[it.accountId];if(!a||a.type!=='asset'||String(a.code).slice(0,2)!=='32'||!it.assetCode)return;const code=String(it.assetCode).trim();
        if((it.debit||0)>0){const dup=invByCode(code);if(dup||_addedCodes[code]){_dupMsgs.push('رمز الأصل «'+code+'» مكرّر — مرتبط بالأصل «'+(dup?dup.name:_addedCodes[code])+'». لم يُضَف للسجل — استخدم رمزاً فريداً.');}else{INV.push({id:rid(),account:String(a.code),name:(it.assetDesc||entry.description||a.name||'أصل')+' — '+code,count:(it.qty||1),value:it.debit,code:code,accum:'',block:'قيد',imported:false,srcEntry:entry.id});_addedCodes[code]=(entry.description||a.name||'أصل');}}
        else if((it.credit||0)>0){const found=invByCode(code);if(found){const nv=(+found.value||0)-(it.credit||0);if(nv>0.005){found.value=nv;_dupMsgs.push('تخفيض الأصل «'+found.name+'» (رمز '+code+') بمقدار '+fmt(it.credit)+' — الرصيد المتبقي '+fmt(nv)+'.');}else{INV=INV.filter(x=>x.id!==found.id);_dupMsgs.push('تم استبعاد الأصل «'+found.name+'» (رمز '+code+') من السجل بالكامل.');}}else{_dupMsgs.push('لا يوجد أصل بالرمز «'+code+'» في السجل لاستبعاده.');}}
      });
    }
    save();resetJ(postable);refresh();
    if(_dupMsgs.length)alert('سجل الأصول:\n'+_dupMsgs.join('\n'));
  }
  drawLines();update();

  // شريط التقرير
  mainEl.appendChild(reportBar({print:()=>printJournal(false),pdf:()=>printJournal(true),excel:exportJournal}));
  // لوحة البحث والفلاتر
  let _searchTimer;
  const scheduleResults=()=>{clearTimeout(_searchTimer);_searchTimer=setTimeout(()=>renderResults(),140);};
  const filt=el('div',{style:merge(S.panel,{display:'flex',gap:10,alignItems:'flex-end',flexWrap:'wrap'})});
  const searchI=el('input',{style:merge(S.input,{width:'100%'}),placeholder:'🔎 رقم القيد · الوصف · الحساب · المبلغ',value:ui.jq,oninput:e=>{ui.jq=e.target.value;scheduleResults();}});
  const typeSel=el('select',{style:S.input,onchange:e=>{ui.jtype=e.target.value;renderMain();}});
  [['all','الكل'],['normal','عادي'],['opening','افتتاحي']].forEach(([v,l])=>typeSel.appendChild(el('option',{value:v},l)));
  typeSel.value=ui.jtype;
  const sortSel=el('select',{style:S.input,onchange:e=>{ui.jsort=e.target.value;renderMain();}});
  [['date','الأحدث أولاً'],['date_asc','الأقدم أولاً'],['no_asc','رقم القيد ↑'],['no_desc','رقم القيد ↓'],['amount_desc','الأكبر مبلغاً']].forEach(([v,l])=>sortSel.appendChild(el('option',{value:v},l)));
  sortSel.value=ui.jsort;
  filt.appendChild(el('label',{style:merge(S.field,{flex:1,minWidth:220})},['بحث',searchI]));
  filt.appendChild(el('label',{style:S.field},['نوع القيد',typeSel]));
  filt.appendChild(el('label',{style:merge(S.field,{minWidth:240})},['تصفية بحساب',jacctCombo()]));
  filt.appendChild(el('label',{style:S.field},['الترتيب',sortSel]));
  filt.appendChild(el('button',{style:S.ghost,onclick:()=>{ui.jq='';ui.jtype='all';ui.jacct='';ui.jsort='date';renderMain();}},'مسح الفلاتر'));
  mainEl.appendChild(filt);
  const resultsBox=el('div',{});
  mainEl.appendChild(resultsBox);
  function renderResults(){
    resultsBox.innerHTML='';
    const list=journalList();
    const ftD=list.reduce((s,e)=>s+entryTotal(e),0);
    const acctLbl=ui.jacct&&byId[ui.jacct]?(' · حساب: '+byId[ui.jacct].name):'';
    resultsBox.appendChild(el('h2',{style:S.section,text:'تقرير القيود اليومية — '+rangeText()+acctLbl}));
    resultsBox.appendChild(el('div',{style:merge(S.legend,{justifyContent:'space-between'})},[
      el('span',{},'عدد القيود المطابقة: '+list.length),
      el('span',{},'إجمالي المبالغ: '+fmt(ftD)),
    ]));
    if(!list.length){resultsBox.appendChild(el('div',{style:S.empty,text:'لا توجد قيود مطابقة للبحث.'}));return;}
    list.forEach(e=>{
      const tot=e.items.reduce((s,it)=>s+(it.debit||0),0);
      const opening=e.kind==='opening';
      const card=el('div',{style:S.card});
      card.appendChild(el('div',{style:S.cardHead},[
        el('div',{style:{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}},[
          el('span',{style:merge(S.tag,{background:C.ink,color:C.paper})},'قيد #'+e.no),
          el('span',{style:{color:C.muted,fontSize:13}},e.date+(e.time?(' · '+e.time):'')),
          el('span',{style:merge(S.tag,opening?{background:'#fbf0d8',color:'#9a7510'}:{background:'#e8e3d4',color:C.inkSoft})},opening?'افتتاحي':'عادي'),
          el('span',{style:{fontWeight:700}},hl(e.description||'—')),
        ]),
        el('div',{style:{display:'flex',gap:8,alignItems:'center'}},[
          el('span',{style:{fontWeight:700,fontFamily:'Georgia,serif'}},fmt(tot)),
          el('button',{style:merge(S.ghost,{borderColor:C.ink,color:C.ink,fontWeight:700}),onclick:()=>previewEntry(e)},'👁 استعراض'),
          el('button',{style:S.ghost,onclick:()=>{J.editingId=e.id;J.date=e.date;J.kind=e.kind||'normal';J.desc=e.description;J.supplier=e.supplier||'';J.lines=e.items.map(it=>({id:rid(),accountId:it.accountId,debit:it.debit||'',credit:it.credit||'',qty:(it.qty!=null?it.qty:''),assetCode:it.assetCode||'',assetDesc:it.assetDesc||''}));renderMain();window.scrollTo({top:0,behavior:'smooth'});}},'تعديل'),
          el('button',{style:S.ghost,onclick:()=>{if(confirm('حذف القيد #'+e.no+'؟')){E=E.filter(x=>x.id!==e.id);save();refresh();}}},'حذف'),
        ]),
      ]));
      const tb=el('tbody');
      e.items.forEach(it=>{const a=byId[it.accountId];tb.appendChild(el('tr',{},[
        el('td',{style:{padding:'5px 0',color:C.inkSoft}},hl(a?(a.code+' — '+a.name):'حساب محذوف')),
        el('td',{style:{padding:'5px 8px',textAlign:'center',width:130,color:C.debit}},it.debit?fmt(it.debit):''),
        el('td',{style:{padding:'5px 8px',textAlign:'center',width:130,color:C.credit}},it.credit?fmt(it.credit):''),
      ]));});
      card.appendChild(el('table',{},tb));
      resultsBox.appendChild(card);
    });
  }
  renderResults();
}
function newLine(p){return {id:rid(),accountId:p[0]?p[0].id:'',debit:'',credit:''};}
function resetJ(p){J={editingId:null,date:todayStr(),kind:'normal',desc:'',supplier:'',lines:[newLine(p),newLine(p)]};}

function journalList(){
  let l=E.filter(e=>inRange(e.date));
  if(ui.jtype&&ui.jtype!=='all')l=l.filter(e=>(e.kind||'normal')===ui.jtype);
  if(ui.jacct){const set=new Set(descPostable(ui.jacct));set.add(ui.jacct);l=l.filter(e=>e.items.some(it=>set.has(it.accountId)));}
  const q=(ui.jq||'').trim();
  if(q)l=l.filter(e=>entryMatches(e,q));
  switch(ui.jsort){
    case 'no_asc': l.sort((a,b)=>(a.no||0)-(b.no||0)); break;
    case 'no_desc': l.sort((a,b)=>(b.no||0)-(a.no||0)); break;
    case 'date_asc': l.sort((a,b)=>a.date>b.date?1:(a.date<b.date?-1:(a.no||0)-(b.no||0))); break;
    case 'amount_desc': l.sort((a,b)=>entryTotal(b)-entryTotal(a)); break;
    default: l.sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:(b.no||0)-(a.no||0))); // date_desc
  }
  return l;
}
function entryTotal(e){return e.items.reduce((s,it)=>s+(it.debit||0),0);}
function entryMatches(e,q){
  if(String(e.no).includes(q))return true;
  if((e.description||'').includes(q))return true;
  return e.items.some(it=>{const a=byId[it.accountId];
    return (a&&(a.name.includes(q)||String(a.code).includes(q)))
      || String(it.debit||'').includes(q) || String(it.credit||'').includes(q)
      || fmt(it.debit||0).includes(q) || fmt(it.credit||0).includes(q);
  });
}
function journalRows(){
  const out=[];

/* ================= دفتر الأستاذ ================= */
function ledgerData(id){
  const leaf=new Set(descPostable(id));
  const {open}=aggMaps();
  const opening=rolledMap(open,id);
  const normal=TYPES[byId[id].type].normal;
  const moves=[];
  E.forEach(e=>{ if(e.kind==='opening')return; if(!inRange(e.date))return;
    e.items.forEach(it=>{ if(leaf.has(it.accountId)) moves.push({date:e.date,desc:e.description,debit:it.debit||0,credit:it.credit||0}); });});
  moves.sort((a,b)=>a.date>b.date?1:-1);
  let run=opening;
  const rows=moves.map(m=>{run+=normal==='debit'?m.debit-m.credit:m.credit-m.debit;return {date:m.date,desc:m.desc,debit:m.debit,credit:m.credit,run:run};});
  return {opening,rows,ending:run,normal};
}

function sidesOf(val,type){const n=TYPES[type].normal;let d=0,c=0;if(n==='debit'){if(val>=0)d=val;else c=-val;}else{if(val>=0)c=val;else d=-val;}return{d,c};}
function trialData(){
  const {open,move}=aggMaps();
  const visible=treeOrder.filter(({acct})=>{
    const o=rolledMap(open,acct.id),mdc=rolledDC(move,acct.id);
    return Math.abs(o)>=0.005||Math.abs(mdc.d)>=0.005||Math.abs(mdc.c)>=0.005;
  });
  let eD=0,eC=0;A.forEach(a=>{const en=natFromMap(open,a.id)+natFromMap(move,a.id);const s=sidesOf(en,a.type);eD+=s.d;eC+=s.c;});
  return {open,move,visible,eD,eC,balanced:Math.abs(eD-eC)<0.005};
}

function addMonths(dateStr,n){const d=new Date(dateStr+'T00:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,dim));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function runDueRecurring(silent){
  let count=0;const now=new Date();
  R.forEach(r=>{if(!r.active)return;let guard=0;
    const step=(r.step!=null)?r.step:(r.monthly===false?0:1);
    if(r.additions&&r.additions.length&&byId[r.debit]&&byId[r.credit]){
      r.additions.forEach(function(ad){
        if(ad.posted)return;const amt=+ad.amount||0;if(amt<=0||!ad.date)return;
        const ad2=new Date(ad.date+'T00:00:00');if(isNaN(ad2)||ad2>now)return;
        const e=createEntry(ad.date,'normal',(r.desc||r.typeLabel)+' — إهلاك الإضافة'+(ad.no?(' (قيد الإضافة رقم '+ad.no+')'):''),[{accountId:r.debit,debit:amt,credit:0},{accountId:r.credit,debit:0,credit:amt}],r.typeLabel,r.time,r.ctx,r.id);
        if(e){e.depAdd=true;ad.posted=e.id;count++;}
      });
    }
    while(r.next){
      const due=new Date(r.next+'T'+((r.time&&/^\d{2}:\d{2}$/.test(r.time))?r.time:'00:00')+':00');
      if(isNaN(due)||due>now)break;
      if(!(byId[r.debit]&&byId[r.credit])){notify('تعذّر توليد قيد دوري («'+(r.desc||r.typeLabel)+'») لأن أحد حساباته محذوف — تم إيقاف القاعدة.');r.active=false;break;}
      let amount=+r.amount||0;
      if(r.additions&&r.additions.length&&step>0){const cut=addMonths(r.next,-step);r.additions.forEach(function(ad){if(ad.date&&ad.date<=cut)amount+=(+ad.amount||0);});}
      const e=createEntry(r.next,'normal',r.desc,[{accountId:r.debit,debit:amount,credit:0},{accountId:r.credit,debit:0,credit:amount}],r.typeLabel,r.time,r.ctx,r.id);
      if(!e)break;
      count++;
      if(step<=0){r.active=false;r.next=null;break;}
      r.next=addMonths(r.next,step);
      if(++guard>600)break;
    }
  });
  if(count){save();if(!silent)alert('تم توليد '+count+' قيد مستحق.');}
  return count;
}

}

/* ================= الأصول غير المتداولة ================= */
let NF={year:String(new Date().getFullYear()),mode:'quarter',period:0,showZero:false};
let NCAF={cost:'',depExp:'',accum:''};
function natOf(type,d,c){return (type==='asset'||type==='expense')?(d-c):(c-d);}
function ncaSum(accId,filter){let d=0,c=0;E.forEach(e=>{if(!filter(e))return;e.items.forEach(it=>{if(it.accountId===accId){d+=+it.debit||0;c+=+it.credit||0;}});});return {d:d,c:c};}
function ncaNatF(accId,filter){const s=ncaSum(accId,filter);const a=byId[accId];return a?natOf(a.type,s.d,s.c):s.d-s.c;}
function ncaPeriods(year,mode){
  const y=+year||new Date().getFullYear();const p=[];
  if(mode==='year'){p.push({label:'سنة '+y,from:y+'-01-01',to:y+'-12-31'});}
  else if(mode==='month'){for(let m=1;m<=12;m++){const mm=String(m).padStart(2,'0');const last=new Date(y,m,0).getDate();p.push({label:'شهر '+mm+'/'+y,from:y+'-'+mm+'-01',to:y+'-'+mm+'-'+String(last).padStart(2,'0')});}}
  else{[['الربع الأول','01-01','03-31'],['الربع الثاني','04-01','06-30'],['الربع الثالث','07-01','09-30'],['الربع الرابع','10-01','12-31']].forEach(function(q){p.push({label:q[0]+' '+y,from:y+'-'+q[1],to:y+'-'+q[2]});});}
  return p;
}
function isNCA(a){return a&&a.type==='asset'&&a.postable&&String(a.code).slice(0,2)==='32'&&!/مجم|إهلاك|اهلاك|استهلاك/.test(a.name)&&!/وسيط/.test(a.name)&&!/استئجار|حق الاستخدام|حقوق الاستخدام|حق استخدام|حقوق استخدام/.test(a.name);}
function ncaManualFor(id){return NCAMANUAL.find(function(m){return m.cost===id;});}
function ncaAllAssets(){var list=A.filter(isNCA);NCAMANUAL.forEach(function(m){var a=byId[m.cost];if(a&&list.indexOf(a)<0)list.push(a);});return list.sort((a,b)=>String(a.code).localeCompare(String(b.code),'en',{numeric:true}));}
function ncaHasMovement(accId){return E.some(e=>e.items.some(it=>it.accountId===accId));}
function ncaGuessLink(costAcc){
  if(!costAcc)return {accum:null,depExp:null};
  let d=costAcc.name.replace(/^\s*تكلفة\s+(الأصل\s*[-–]?\s*)?/,'').replace(/^\s*[-–]\s*/,'').trim();
  if(!d||d.length<3)return {accum:null,depExp:null};
  const parts=d.split(/\s*[-–]\s*/).filter(x=>x.trim().length>=3);
  const core=parts.length?parts[parts.length-1].trim():d;
  const isAccum=a=>a.postable&&/مجمّع|مجمع/.test(a.name)&&/استهلاك|هلاك|استنفاد|إطفاء|اطفاء/.test(a.name);
  const isDep=a=>a.postable&&a.type==='expense'&&/مصروف/.test(a.name)&&/استهلاك|هلاك|استنفاد|إطفاء|اطفاء/.test(a.name);
  const find=pred=>A.find(a=>pred(a)&&a.name.indexOf(d)>=0)||(core!==d?A.find(a=>pred(a)&&a.name.indexOf(core)>=0):null);
  const accum=find(isAccum),depExp=find(isDep);
  return {accum:accum?accum.id:null,depExp:depExp?depExp.id:null};
}
function ncaLink(assetId){
  var _m=ncaManualFor(assetId);if(_m)return {depExp:_m.depExp||null,accum:_m.accum||null,src:'يدوي (مضاف)'};
  for(let i=E.length-1;i>=0;i--){const e=E[i];if(e.ctx===assetId&&e.auto&&e.auto.indexOf('إهلاك')>=0){const dr=e.items.find(it=>(+it.debit||0)>0.0001),cr=e.items.find(it=>(+it.credit||0)>0.0001);return {depExp:dr?dr.accountId:null,accum:cr?cr.accountId:null,src:'قيد آلي'};}}
  for(const r of R){if(r.ctx===assetId&&r.typeLabel&&r.typeLabel.indexOf('إهلاك')>=0)return {depExp:r.debit,accum:r.credit,src:'قيد دوري'};}
  if(NCALinks[assetId]&&NCALinks[assetId].accum)return {depExp:NCALinks[assetId].depExp||null,accum:NCALinks[assetId].accum,src:'يدوي'};
  const g=ncaGuessLink(byId[assetId]);if(g.accum)return {depExp:g.depExp,accum:g.accum,src:'تلقائي بالاسم'};
  return {depExp:null,accum:null,src:null};
}
/* القيود الافتتاحية تُعامل كرصيد أول المدة؛ الإضافات/الاستبعادات من القيود العادية فقط */
function ncaRow(costId,accumId,per){
  const from=per.from,to=per.to;
  const openCost=ncaNatF(costId,e=>e.date<from)+ncaNatF(costId,e=>e.date>=from&&e.date<=to&&e.kind==='opening');
  const mv=ncaSum(costId,e=>e.date>=from&&e.date<=to&&e.kind!=='opening');
  const closeCost=ncaNatF(costId,e=>e.date<=to);
  const accumClose=accumId?ncaNatF(accumId,e=>e.date<=to):0;
  const accumOpen=accumId?(ncaNatF(accumId,e=>e.date<from)+ncaNatF(accumId,e=>e.date>=from&&e.date<=to&&e.kind==='opening')):0;
  // مصروف الإهلاك = الزيادات فقط (الطرف الدائن على مجمع الإهلاك)؛ التخفيض (مدين) لا يُحتسب مصروفاً — يظهر أثره في رصيد المجمّع فقط
  const accMv=accumId?ncaSum(accumId,e=>e.date>=from&&e.date<=to&&e.kind!=='opening'):{d:0,c:0};
  const accAdd=accumId?ncaSum(accumId,e=>e.date>=from&&e.date<=to&&e.kind!=='opening'&&e.depAdd===true):{d:0,c:0};
  const depAdd=accAdd.c;
  const depBase=accMv.c-accAdd.c;
  const dep=accMv.c;
  return {label:per.label,openCost:openCost,add:mv.d,disp:mv.c,closeCost:closeCost,dep:dep,depBase:depBase,depAdd:depAdd,accumClose:accumClose,bookOpen:openCost-accumOpen,bookClose:closeCost-accumClose};
}
function ncaHasBalance(a,per){var L=ncaLink(a.id);var r=ncaRow(a.id,L.accum,per);return r.closeCost>0.005;}
function ncaVisible(){var per=ncaCurPeriod();return ncaAllAssets().filter(a=>NCAHidden.indexOf(a.id)<0&&(NF.showZero||ncaManualFor(a.id)||ncaHasBalance(a,per)));}

function ncaDMY(s){if(!s)return '';const p=String(s).split('-');return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):s;}
function ncaDayBefore(s){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function settleGet(accId){return SETTLE.find(s=>s.accountId===accId)||null;}
function settleFor(accId){let x=settleGet(accId);if(!x){x={id:rid(),accountId:accId,balance:null,suppliers:[]};SETTLE.push(x);}return x;}
function settleReduction(accId,name){let sum=0;E.forEach(e=>{if((e.supplier||'')!==name)return;e.items.forEach(it=>{if(it.accountId===accId)sum+=(+it.debit||0)-(+it.credit||0);});});return sum;}
function settleSupplierNames(){const set=new Set();SETTLE.forEach(s=>s.suppliers.forEach(v=>set.add(v.name)));return Array.from(set);}
function settleAcctLinked(accId){return SETTLE.some(s=>s.accountId===accId&&s.suppliers.length);}
function settleAllSuppliers(){const out=[];SETTLE.forEach(s=>{const acc=byId[s.accountId];s.suppliers.forEach(v=>out.push({name:v.name,accId:s.accountId,accName:acc?acc.name:''}));});return out;}
function settleSuppliersForAccts(accIds){const out=[];SETTLE.forEach(s=>{if(accIds.indexOf(s.accountId)>=0){const acc=byId[s.accountId];s.suppliers.forEach(v=>out.push({name:v.name,accId:s.accountId,accName:acc?acc.name:''}));}});return out;}
function settleAddState(id){if(!SF.add[id])SF.add[id]={name:'',project:'',amount:''};return SF.add[id];}
function renderSettle(){
  const panel=el('div',{style:S.panel});
  panel.appendChild(el('h2',{style:merge(S.panelTitle,{marginBottom:6}),text:'التسويات الجردية — تحليل أرصدة الحسابات حسب الموردين'}));
  panel.appendChild(el('div',{style:merge(S.hint,{marginTop:0,marginBottom:12})},'أضف تحليلاً لأي حساب (يُجلب رصيده تلقائياً) ثم أضف الموردين. كل الجداول تظهر أدناه دفعةً واحدة. عند إنشاء قيد يمسّ حساباً مرتبطاً هنا يصبح اختيار المورد إلزامياً ويتحدّث «المخفَّض/المتبقّي» تلقائياً.'));
  panel.appendChild(el('div',{style:S.formRow},[
    fld('أضف تحليلاً لحساب',acctPicker(SF,'account',true,'مثال: ذمم دائنة للموردين',id=>{SF.balance=(+ownBal(id).toFixed(2));renderMain();})),
    fld('الرصيد المراد تحليله',numInput(SF,'balance')),
    el('div',{style:{alignSelf:'flex-end'}},el('button',{style:S.primary,onclick:()=>{
      if(!SF.account)return alert('اختر الحساب أولاً.');
      const an=settleFor(SF.account);an.balance=+SF.balance||ownBal(SF.account);save();SF.account='';SF.balance='';renderMain();
    }},'➕ إنشاء/تحديث تحليل')),
  ]));
  mainEl.appendChild(panel);

  if(!SETTLE.length){mainEl.appendChild(el('div',{style:S.empty,text:'لا توجد تحليلات بعد. اختر حساباً وأنشئ تحليله.'}));return;}
  SETTLE.forEach(an=>{
    const acc=byId[an.accountId];const bal=(an.balance!=null?an.balance:ownBal(an.accountId));
    const box=el('div',{style:S.card});
    box.appendChild(el('div',{style:S.cardHead},[
      el('div',{},[el('h3',{style:{margin:0,fontFamily:'Georgia,serif',fontSize:18}},'📋 '+(acc?acc.name:'حساب')),el('div',{style:{fontSize:12,color:C.muted}},(acc?acc.code:'')+' · الرصيد الحالي: '+fmt(ownBal(an.accountId)))]),
      el('div',{style:{display:'flex',gap:6}},[
        el('button',{style:S.exp,onclick:()=>exportSettle(an.accountId)},'⤓ Excel'),
        el('button',{style:merge(S.ghost,{borderColor:C.ink,color:C.ink,fontWeight:700}),onclick:()=>printSettle(an.accountId)},'🖨 PDF'),
        el('button',{style:S.ghost,onclick:()=>{if(confirm('حذف تحليل «'+(acc?acc.name:'')+'»؟')){SETTLE=SETTLE.filter(x=>x.id!==an.id);save();renderMain();}}},'حذف'),
      ]),
    ]));
    box.appendChild(el('div',{style:{display:'flex',gap:14,flexWrap:'wrap',fontSize:13.5,margin:'2px 0 10px'}},[
      el('label',{style:{display:'flex',gap:6,alignItems:'center'}},['الرصيد المُحلَّل:',el('input',{type:'number',style:merge(S.input,{width:160}),value:(an.balance!=null?an.balance:''),oninput:e=>{an.balance=+e.target.value||0;},onchange:()=>{save();renderMain();}})]),
    ]));
    // نموذج إضافة مورد لهذا التحليل
    const st=settleAddState(an.id);
    const addRow=el('div',{style:{display:'flex',gap:8,alignItems:'flex-end',flexWrap:'wrap',marginBottom:10}});
    addRow.appendChild(fld('اسم المورد',txtInput(st,'name','مثال: شركة علم')));
    addRow.appendChild(fld('المشروع / الوصف',txtInput(st,'project','مثال: مشروع كذا')));
    addRow.appendChild(fld('قيمة المبلغ',numInput(st,'amount')));
    addRow.appendChild(el('button',{style:S.primary,onclick:()=>{if(!st.name.trim())return alert('أدخل اسم المورد.');const amt=+st.amount||0;if(amt<=0)return alert('أدخل مبلغاً صحيحاً.');an.suppliers.push({id:rid(),name:st.name.trim(),project:st.project.trim(),amount:amt});st.name='';st.project='';st.amount='';save();renderMain();}},'➕ إضافة مورد'));
    box.appendChild(addRow);
    // الجدول
    let ta=0,tr=0;const tb=el('tbody');
    an.suppliers.forEach(v=>{const red=settleReduction(an.accountId,v.name);const rem=v.amount-red;ta+=v.amount;tr+=red;
      tb.appendChild(el('tr',{},[
        el('td',{style:S.td},v.name),
        el('td',{style:S.td},v.project||'—'),
        el('td',{style:merge(S.tdN,{textAlign:'center',fontWeight:700})},fmt(v.amount)),
        el('td',{style:merge(S.tdN,{textAlign:'center',color:C.debit})},red?fmt(red):'—'),
        el('td',{style:merge(S.tdN,{textAlign:'center',fontWeight:700,color:rem<-0.005?C.debit:C.blue})},fmt(rem)),
        el('td',{style:merge(S.td,{textAlign:'center'})},el('button',{style:S.ghost,onclick:()=>{an.suppliers=an.suppliers.filter(x=>x.id!==v.id);save();renderMain();}},'حذف')),
      ]));
    });
    if(ta>bal+0.005)box.appendChild(el('div',{style:{background:'#fdecec',border:'1px solid #e7b8b8',borderRadius:10,padding:'9px 13px',margin:'4px 0',color:'#8c2f39',fontWeight:800}},'⚠ إجمالي مبالغ الموردين ('+fmt(ta)+') يتجاوز الرصيد ('+fmt(bal)+') بمقدار '+fmt(ta-bal)+'.'));
    if(!an.suppliers.length)box.appendChild(el('div',{style:S.empty,text:'لم تُضف موردين لهذا الحساب بعد.'}));
    else box.appendChild(el('div',{style:S.wrap},el('table',{},[
      el('thead',{},el('tr',{},['اسم المورد','المشروع / الوصف','المبلغ','المخفَّض (من القيود)','المتبقّي','—'].map((h,i)=>el('th',{style:merge(S.th,i>1&&i<5?{textAlign:'center'}:{})},h)))),
      tb,
      el('tfoot',{},el('tr',{},[
        el('td',{style:S.tfoot,colspan:2},'الإجمالي · غير موزّع: '+fmt(bal-ta)),
        el('td',{style:merge(S.tfoot,{textAlign:'center'})},fmt(ta)),
        el('td',{style:merge(S.tfoot,{textAlign:'center',color:C.debit})},fmt(tr)),
        el('td',{style:merge(S.tfoot,{textAlign:'center'})},fmt(ta-tr)),
        el('td',{style:S.tfoot},''),
      ])),
    ])));
    mainEl.appendChild(box);
  });
}
function settleRowsData(accId){const an=settleGet(accId);if(!an)return [];return an.suppliers.map(v=>{const red=settleReduction(accId,v.name);return {name:v.name,project:v.project||'',amount:v.amount,red:red,rem:v.amount-red};});}
function exportSettle(accId){
  const acc=byId[accId];const an=settleGet(accId);const data=settleRowsData(accId);if(!data.length)return alert('لا توجد بيانات.');
  const bal=an&&an.balance!=null?an.balance:ownBal(accId);
  const rows=[[{v:'تحليل: '+(acc?acc.name:'')+' — الرصيد '+((+bal).toFixed(2)),t:'s'}],['اسم المورد','المشروع/الوصف','المبلغ','المخفَّض','المتبقّي'].map(h=>({v:h,t:'s'}))];
  let ta=0,tr=0;data.forEach(d=>{ta+=d.amount;tr+=d.red;rows.push([{v:d.name,t:'s'},{v:d.project,t:'s'},{v:+d.amount.toFixed(2),t:'n'},{v:+d.red.toFixed(2),t:'n'},{v:+d.rem.toFixed(2),t:'n'}]);});
  rows.push([{v:'الإجمالي',t:'s'},{v:'',t:'s'},{v:+ta.toFixed(2),t:'n'},{v:+tr.toFixed(2),t:'n'},{v:+(ta-tr).toFixed(2),t:'n'}]);
  downloadXlsx('التسويات_'+(acc?acc.code:'')+'.xlsx',rows,'التسويات الجردية');
}
function printSettle(accId){
  const acc=byId[accId];const an=settleGet(accId);const data=settleRowsData(accId);if(!data.length){alert('لا توجد بيانات.');return;}
  const bal=an&&an.balance!=null?an.balance:ownBal(accId);
  const w=window.open('','_blank');if(!w){alert('فضلاً اسمح بالنوافذ المنبثقة للطباعة.');return;}
  let ta=0,tr=0,body='';data.forEach(d=>{ta+=d.amount;tr+=d.red;body+='<tr><td>'+xmlEsc(d.name)+'</td><td>'+xmlEsc(d.project)+'</td><td style="text-align:center;font-weight:700">'+fmt(d.amount)+'</td><td style="text-align:center;color:#b23b4e">'+(d.red?fmt(d.red):'—')+'</td><td style="text-align:center;font-weight:700">'+fmt(d.rem)+'</td></tr>';});
  const foot='<tr class="ft"><td colspan="2">الإجمالي</td><td style="text-align:center">'+fmt(ta)+'</td><td style="text-align:center">'+fmt(tr)+'</td><td style="text-align:center">'+fmt(ta-tr)+'</td></tr>';
  const html='<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>التسويات الجردية</title><style>'
    +'@page{size:A4;margin:14mm;}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}body{font-family:Tahoma,sans-serif;color:#1f2733;margin:0;padding:16px;}'
    +'.bar{display:flex;gap:8px;margin-bottom:14px;}.bar button{border:1px solid #cbd3df;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-family:inherit;}.bar .pdf{background:#1f2733;color:#fff;border-color:#1f2733;}@media print{.bar{display:none;}}'
    +'.head{border-bottom:2px solid #1f2733;padding-bottom:8px;margin-bottom:12px;}h1{font-size:19px;margin:0;}.sub{color:#64748b;font-size:12px;}'
    +'table{width:100%;border-collapse:collapse;font-size:12.5px;}th{background:#2a2d38;color:#fff;padding:7px;border:1px solid #cbd3df;}td{padding:6px;border:1px solid #e6e9ef;}tr.ft td{background:#eef1f6;font-weight:800;}'
    +'</style></head><body><div class="bar"><button class="pdf" onclick="window.print()">🖨 طباعة / حفظ PDF</button><button onclick="window.close()">إغلاق</button></div>'
    +'<div class="head"><h1>التسويات الجردية — '+xmlEsc(acc?acc.name:'')+'</h1><div class="sub">الرصيد: '+fmt(+bal)+' · طُبع في '+new Date().toLocaleString('en-GB')+'</div></div>'
    +'<table><thead><tr>'+['اسم المورد','المشروع / الوصف','المبلغ','المخفَّض','المتبقّي'].map((h,i)=>'<th style="text-align:'+(i>1?'center':'right')+'">'+h+'</th>').join('')+'</tr></thead><tbody>'+body+foot+'</tbody></table></body></html>';
  w.document.open();w.document.write(html);w.document.close();w.focus();
}

function importAssetFile(file){

      let blocks=[];
      wb.sheets.forEach(sh=>{const b=parseAssetSchedule(sh.rows,sh.name);if(b.length)blocks=blocks.concat(b);});
      if(!blocks.length){alert('لم يُعثر على جداول أصول (رقم حساب + م/عدد/الأصل/القيمة) داخل الملف.');return;}
      let added=0,dups=0,mismatches=[];const existing={};INV.forEach(it=>existing[it.account+'|'+it.name+'|'+invValue(it)]=1);
      blocks.forEach(bl=>{

      if(mismatches.length)msg+='\n\nتنبيه فروقات (لم تُصحَّح تلقائياً):\n'+mismatches.join('\n');

  rd.readAsArrayBuffer(file);
}
function invItemize(){
  const out=[];
  invFiltered().forEach(function(it){
    const n=Math.max(1,parseInt(it.count,10)||1);const V=+invValue(it)||0;
    if(n<=1){out.push({account:it.account,name:it.name,value:V,__src:it});}
    else{const per=Math.round((V/n)*100)/100;for(let k=1;k<=n;k++){const v=(k<n)?per:(Math.round((V-per*(n-1))*100)/100);out.push({account:it.account,name:it.name+' ('+k+'/'+n+')',value:v,__src:it});}}
  });
  return out;
}

function officialType(code){var c=String(code).charAt(0);return c==="1"?"revenue":c==="2"?"expense":c==="3"?"asset":c==="4"?"liability":"equity";}
function applyOfficialChart(){
 var byCode={};A.forEach(function(a){byCode[String(a.code)]=a;});
 var official={};OFFICIAL_CHART.forEach(function(o){official[o[0]]=1;});
 var used=usedSet();
 OFFICIAL_CHART.forEach(function(o){var code=o[0],name=o[1],post=!!o[2];var a=byCode[code];
   if(a){a.name=name;a.type=officialType(code);a.postable=post||used.has(a.id);}
   else{a={id:"g"+code,code:code,name:name,type:officialType(code),postable:post,parentId:null};A.push(a);byCode[code]=a;}});
 A.forEach(function(a){var c=String(a.code).charAt(0);if("12345".indexOf(c)>=0&&!official[String(a.code)])a.type=officialType(a.code);});
 A.forEach(function(a){var code=String(a.code),parent=null;for(var L=code.length-1;L>=1;L--){var pc=code.slice(0,L);if(byCode[pc]){parent=byCode[pc];break;}}a.parentId=parent?parent.id:null;});
}

let NOTESF={month:'',text:'',editId:null};
function renderNotes(){
  const panel=el('div',{style:S.panel});
  panel.appendChild(el('h2',{style:merge(S.panelTitle,{marginBottom:4}),text:'الملاحظات — سجل الأعمال الشهرية'}));
  panel.appendChild(el('div',{style:merge(S.hint,{marginTop:0,marginBottom:10})},'أضِف ملاحظاتك وأعمالك الشهرية هنا. تُحفظ تلقائياً وتبقى بين السنوات.'));
  if(!NOTESF.month)NOTESF.month=String(FYCUR)+'-'+String(new Date().getMonth()+1).padStart(2,'0');
  const box=el('div',{style:merge(S.panel,{background:'#faf9f6'})});
  box.appendChild(el('h3',{style:{margin:'0 0 8px',fontFamily:'Georgia,serif',fontSize:16}},NOTESF.editId?'✎ تعديل ملاحظة':'➕ ملاحظة جديدة'));
  const monthI=el('input',{type:'month',style:merge(S.input,{maxWidth:180}),value:NOTESF.month,oninput:e=>{NOTESF.month=e.target.value;}});
  box.appendChild(el('div',{style:S.formRow},[fld('الشهر',monthI)]));
  const textI=el('textarea',{style:merge(S.input,{minHeight:120,width:'100%',fontFamily:'inherit'}),oninput:e=>NOTESF.text=e.target.value,placeholder:'اكتب أعمالك وملاحظاتك لهذا الشهر…'});
  textI.value=NOTESF.text||'';
  box.appendChild(el('label',{style:merge(S.field,{marginTop:4})},['نص الملاحظة / الأعمال',textI]));
  box.appendChild(el('div',{style:{display:'flex',gap:6,marginTop:8}},[
    el('button',{style:S.primary,onclick:()=>{
      const txt=((textI&&textI.value!=null?textI.value:NOTESF.text)||'').trim();
      const mon=(monthI&&monthI.value)?monthI.value:NOTESF.month;
      if(!txt)return alert('اكتب نص الملاحظة أولاً.');
      if(NOTESF.editId){const n=NOTES.find(x=>x.id===NOTESF.editId);if(n){n.month=mon;n.text=txt;n.at=new Date().toISOString();}}
      else NOTES.unshift({id:rid(),month:mon,text:txt,at:new Date().toISOString()});
      NOTESF={month:mon,text:'',editId:null};save();renderMain();
      notify('📝 تم حفظ ملاحظة — '+mon);
    }},NOTESF.editId?'حفظ التعديل':'إضافة'),
    NOTESF.editId?el('button',{style:S.ghost,onclick:()=>{NOTESF={month:NOTESF.month,text:'',editId:null};renderMain();}},'إلغاء'):'',
  ]));
  mainEl.appendChild(box);
  if(!NOTES.length){mainEl.appendChild(el('div',{style:S.empty,text:'لا توجد ملاحظات بعد.'}));return;}
  const byMonth={};NOTES.forEach(function(n){(byMonth[n.month||'—']=byMonth[n.month||'—']||[]).push(n);});
  Object.keys(byMonth).sort().reverse().forEach(function(m){
    const card=el('div',{style:S.card});
    card.appendChild(el('h3',{style:{margin:'0 0 6px',fontFamily:'Georgia,serif',fontSize:16}},'🗓 '+m));
    byMonth[m].forEach(function(n){
      card.appendChild(el('div',{style:{display:'flex',gap:8,alignItems:'flex-start',padding:'8px 0',borderTop:'1px solid '+C.paperEdge}},[
        el('div',{style:{flex:1,whiteSpace:'pre-wrap',fontSize:14,lineHeight:1.6}},n.text),
        el('div',{style:{display:'flex',gap:4,flexShrink:0}},[
          el('button',{style:S.ghost,onclick:()=>{NOTESF={month:n.month,text:n.text,editId:n.id};renderMain();window.scrollTo({top:0,behavior:'smooth'});}},'تعديل'),
          el('button',{style:merge(S.ghost,{color:C.debit,borderColor:'#e7b8b8'}),onclick:()=>{if(confirm('حذف هذه الملاحظة؟')){NOTES=NOTES.filter(x=>x.id!==n.id);save();renderMain();}}},'حذف'),
        ]),
      ]));
    });
    mainEl.appendChild(card);
  });
}

}
